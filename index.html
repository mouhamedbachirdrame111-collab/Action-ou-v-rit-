<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action ou Vérité</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #17122e, #26104d, #071b35);
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin: 15px 0 5px;
}

.subtitle {
    text-align: center;
    opacity: .8;
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

input {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #7c3aed;
}

button:active {
    transform: scale(.98);
}

.btn-green {
    background: #16a34a;
}

.btn-red {
    background: #dc2626;
}

.btn-blue {
    background: #2563eb;
}

.btn-orange {
    background: #ea580c;
}

.hidden {
    display: none;
}

.player-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,.08);
    padding: 12px;
    border-radius: 12px;
    margin: 8px 0;
}

.score {
    font-weight: bold;
    color: #facc15;
}

.turn {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.type {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
}

.challenge {
    background: rgba(0,0,0,.25);
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    font-size: 22px;
    line-height: 1.5;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.buttons button {
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.15);
}

th {
    color: #facc15;
}

.message {
    text-align: center;
    margin: 10px 0;
    color: #86efac;
}

.small {
    font-size: 13px;
    opacity: .7;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 ACTION OU VÉRITÉ</h1>
<p class="subtitle">2 à 10 joueurs • Scores • Classement</p>

<!-- ÉCRAN JOUEURS -->
<div id="setup" class="card">

    <h2>👥 Ajouter les joueurs</h2>
    <p style="margin:10px 0;opacity:.8;">
        Entre entre 2 et 10 noms.
    </p>

    <div id="inputs"></div>

    <button onclick="startGame()">
        🚀 COMMENCER LA PARTIE
    </button>

    <p id="error" style="color:#fca5a5;text-align:center;margin-top:10px;"></p>

</div>


<!-- JEU -->
<div id="game" class="hidden">

    <div class="card">

        <div class="turn" id="turn"></div>

        <div class="type" id="type"></div>

        <div class="challenge" id="challenge"></div>

        <div class="buttons">
            <button class="btn-green" onclick="successChallenge()">
                ✅ RÉUSSI +10
            </button>

            <button class="btn-red" onclick="skipChallenge()">
                ❌ PASSER
            </button>
        </div>

        <button class="btn-blue" onclick="newChallenge()">
            🎲 NOUVEAU DÉFI
        </button>

        <button class="btn-orange" onclick="showRanking()">
            🏆 CLASSEMENT
        </button>

    </div>


    <div class="card">

        <h2>📊 Scores</h2>

        <div id="scoreList"></div>

    </div>

</div>


<!-- CLASSEMENT -->
<div id="ranking" class="hidden">

    <div class="card">

        <h2 style="text-align:center;">🏆 CLASSEMENT</h2>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Joueur</th>
                    <th>Points</th>
                </tr>
            </thead>

            <tbody id="rankingBody"></tbody>
        </table>

        <button onclick="backToGame()" class="btn-blue">
            ↩️ RETOUR AU JEU
        </button>

        <button onclick="restartGame()" class="btn-red">
            🔄 NOUVELLE PARTIE
        </button>

    </div>

</div>

<p class="small">
    Action ou Vérité • Version mobile
</p>

</div>
